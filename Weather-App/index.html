<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="weather-card">
    <h1>Weather App</h1>
    <p class="subtitle">Check the weather anywhere</p>

    <form id="search-form" class="search">
      <input id="city-input" type="text" placeholder="Enter city name..." aria-label="City name" required>
      <button type="submit">Search</button>
    </form>

    <button id="location-btn" class="location-btn" type="button">Use My Current Location</button>
    <p id="message" class="message" role="status">Search for a city to see its weather.</p>

    <section id="weather" class="weather hidden" aria-live="polite">
      <h2 id="city-name">City</h2>
      <div class="main-weather">
        <span id="weather-icon" class="weather-icon">🌤️</span>
        <div>
          <p id="temperature" class="temperature">--°C</p>
          <p id="condition" class="condition">Condition</p>
        </div>
      </div>
      <div class="details">
        <div class="detail"><span>Feels like</span><strong id="feels-like">--°C</strong></div>
        <div class="detail"><span>Humidity</span><strong id="humidity">--%</strong></div>
        <div class="detail"><span>Wind speed</span><strong id="wind">-- km/h</strong></div>
      </div>
      <p id="updated" class="updated"></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
